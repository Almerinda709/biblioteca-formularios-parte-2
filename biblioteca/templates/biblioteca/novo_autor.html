<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo autor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
        h1 { text-align: center; }
        a { color: #06c; }
        .campo { margin-bottom: 16px; }
        .campo label { display: block; font-weight: bold; margin-bottom: 4px; }
        .campo input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; }
        .campo.com-erro input { border-color: #b00; }
        .erro { color: #b00; font-size: 14px; margin: 4px 0 0; }
        button { background: #333; color: #fff; border: 0; padding: 10px 18px; cursor: pointer; }
    </style>
</head>
<body>
    <p><a href="{% url 'biblioteca:listar_livros' %}">&larr; Voltar para a lista</a></p>
    <h1>Novo autor</h1>

    <form method="post" novalidate>
        {% csrf_token %}

        <div class="campo{% if form.nome.errors %} com-erro{% endif %}">
            <label for="{{ form.nome.id_for_label }}">{{ form.nome.label }}</label>
            {{ form.nome }}
            {% for erro in form.nome.errors %}
                <p class="erro">{{ erro }}</p>
            {% endfor %}
        </div>

        <div class="campo{% if form.nacionalidade.errors %} com-erro{% endif %}">
            <label for="{{ form.nacionalidade.id_for_label }}">{{ form.nacionalidade.label }} (opcional)</label>
            {{ form.nacionalidade }}
            {% for erro in form.nacionalidade.errors %}
                <p class="erro">{{ erro }}</p>
            {% endfor %}
        </div>

        <button type="submit">Salvar</button>
    </form>
</body>
</html>
